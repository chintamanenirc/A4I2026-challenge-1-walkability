# MCP Toolbox for Databases: heat-planner toolset (the required managed MCP server).
# Reads the documented a4i_semantic layer (see docs/HANDOFF.md), never raw tables.
# PROJECT is rendered by .agents/skills/gcp-platform/scripts/deploy_toolbox.sh.
# Read-only is enforced by IAM on toolbox-sa. Validate against the pinned Toolbox version's docs.

sources:
  heat-bq:
    kind: bigquery
    project: PROJECT
    location: US

tools:
  tract_profile:
    kind: bigquery-sql
    source: heat-bq
    description: >
      Profile of the census tract nearest a coordinate: population, residents 65+,
      car-free households, no-vehicle rate, poverty rate, median income and age.
      Aggregate public data with no race columns.
    parameters:
      - name: lat
        type: float
        description: Latitude, decimal degrees.
      - name: lon
        type: float
        description: Longitude, decimal degrees.
    statement: |
      SELECT geo_id, population, pop_65_plus, ROUND(share_65_plus, 3) AS share_65_plus,
             car_free_households, ROUND(no_vehicle_rate, 3) AS no_vehicle_rate,
             ROUND(poverty_rate, 3) AS poverty_rate, median_income, median_age
      FROM `PROJECT.a4i_semantic.dim_tract`
      WHERE centroid_lat IS NOT NULL
      ORDER BY ST_DISTANCE(ST_GEOGPOINT(@lon, @lat), ST_GEOGPOINT(centroid_lon, centroid_lat))
      LIMIT 1

  vulnerable_population:
    kind: bigquery-sql
    source: heat-bq
    description: >
      Who lives within a straight-line radius of a site: total population, residents 65+,
      car-free households and population-weighted poverty, summed over tracts whose
      centre falls inside the radius. Use for "who lives near this site".
    parameters:
      - name: lat
        type: float
        description: Site latitude, decimal degrees.
      - name: lon
        type: float
        description: Site longitude, decimal degrees.
      - name: radius_m
        type: float
        description: Straight-line radius in metres (500 to 3000 is typical; capped at 5000).
    statement: |
      SELECT * FROM `PROJECT.a4i_semantic.vulnerable_population`(@lat, @lon, LEAST(@radius_m, 5000))

  city_heat_days_by_year:
    kind: bigquery-sql
    source: heat-bq
    description: >
      Days per year (full years 2019-2025) when Atlanta's stations reached 90, 95 and 100 °F,
      with multi-year means. City-wide only: says nothing about which neighbourhoods are hotter.
      The slope is 7 years of weather variability, not a climate trend.
    statement: |
      SELECT * FROM `PROJECT.a4i_semantic.metric_city_heat_days_by_year` ORDER BY year

  site_hot_days:
    kind: bigquery-sql
    source: heat-bq
    description: >
      How many days a year a site with a given heat offset (°F above the city average)
      reaches the equivalent of 95 °F, compared with the city baseline. Pairs a predicted
      offset with the station history to justify a permanent site.
    parameters:
      - name: offset_f
        type: float
        description: Predicted heat offset in °F relative to the city average.
    statement: |
      SELECT * FROM `PROJECT.a4i_semantic.site_hot_days`(@offset_f)

toolsets:
  heat-planner:
    - tract_profile
    - vulnerable_population
    - city_heat_days_by_year
    - site_hot_days
