# Builds the planner image from app/Dockerfile (repo root as context) and pushes it
# to Artifact Registry. Tag with the commit, never :latest:
#   gcloud builds submit --config app/cloudbuild.yaml \
#     --substitutions _REGION=$REGION,_TAG=$(git rev-parse --short HEAD) .
substitutions:
  _REGION: us-central1
  _REPO: heat-planner
  _TAG: ""
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - app/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/heat-planner-app:${_TAG}
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/heat-planner-app:${_TAG}
